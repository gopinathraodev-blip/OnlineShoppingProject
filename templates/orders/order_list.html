{% extends "base.html" %}

{% block title %}
My Orders | Online Shopping
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="mb-4">

        <h2 class="fw-bold">
            My Orders
        </h2>

        <p class="text-muted">
            View your previous orders
        </p>

    </div>


    <div id="ordersContent">

        <div class="text-center py-5">

            <div
                class="spinner-border"
                role="status"
            >
                <span class="visually-hidden">
                    Loading...
                </span>
            </div>

        </div>

    </div>

</div>

{% endblock %}
