{% extends "base.html" %}

{% block title %}
Checkout | Online Shopping
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row g-4">

        <!-- Shipping Information -->
        <div class="col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h3 class="fw-bold mb-4">
                        Checkout
                    </h3>

                    <div
                        id="checkoutMessage"
                        class="alert d-none"
                    ></div>

                    <form id="checkoutForm">

                        <div class="mb-3">

                            <label
                                for="shipping_address"
                                class="form-label"
                            >
                                Shipping Address
                            </label>

                            <textarea
                                id="shipping_address"
                                class="form-control"
                                rows="3"
                                required
                            ></textarea>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="shipping_city"
                                    class="form-label"
                                >
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="shipping_city"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    for="shipping_state"
                                    class="form-label"
                                >
                                    State
                                </label>

                                <input
                                    type="text"
                                    id="shipping_state"
                                    class="form-control"
                                    required
                                >

                            </div>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="shipping_postal_code"
                                    class="form-label"
                                >
                                    Postal Code
                                </label>

                                <input
                                    type="text"
                                    id="shipping_postal_code"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    for="shipping_country"
                                    class="form-label"
                                >
                                    Country
                                </label>

                                <input
                                    type="text"
                                    id="shipping_country"
                                    class="form-control"
                                    value="India"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Place Order
                        </button>

                    </form>

                </div>

            </div>

        </div>


        <!-- Order Summary -->
        <div class="col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h4 class="fw-bold mb-4">
                        Order Summary
                    </h4>

                    <div id="checkoutSummary">

                        <div class="text-center py-4">

                            <div
                                class="spinner-border"
                                role="status"
                            >
                                <span
                                    class="visually-hidden"
                                >
                                    Loading...
                                </span>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
