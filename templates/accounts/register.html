{% extends "base.html" %}

{% block title %}
Register | Online Shopping
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="fw-bold text-center mb-4">
                        Create Account
                    </h2>

                    <div
                        id="registerMessage"
                        class="alert d-none"
                    ></div>

                    <form id="registerForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="first_name"
                                    class="form-label"
                                >
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="first_name"
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    for="last_name"
                                    class="form-label"
                                >
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="last_name"
                                >

                            </div>

                        </div>


                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                minlength="8"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="phone_number"
                                class="form-label"
                            >
                                Phone Number
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="phone_number"
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="address"
                                class="form-label"
                            >
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                id="address"
                                rows="3"
                            ></textarea>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="city"
                                    class="form-label"
                                >
                                    City
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="city"
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    for="state"
                                    class="form-label"
                                >
                                    State
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="state"
                                >

                            </div>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="postal_code"
                                    class="form-label"
                                >
                                    Postal Code
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="postal_code"
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    for="country"
                                    class="form-label"
                                >
                                    Country
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="country"
                                    value="India"
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Create Account
                        </button>

                    </form>


                    <p class="text-center mt-4 mb-0">
                        Already have an account?

                        <a href="/api/accounts/login-page/">
                            Login
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
