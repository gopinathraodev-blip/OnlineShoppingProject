{% extends "base.html" %}

{% block title %}
Login | Online Shopping
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="fw-bold text-center mb-4">
                        Login
                    </h2>

                    <div
                        id="loginMessage"
                        class="alert d-none"
                    ></div>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                required
                            >
                        </div>


                        <div class="mb-3">
                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                required
                            >
                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <p class="text-center mt-4 mb-0">
                        Don't have an account?

                        <a href="/api/accounts/register-page/">
                            Register
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
